# Go CI for the gasworks monorepo — the sole CI now that the Python CLI has been retired
# (the old pytest `ci.yml` was removed in the retire-Python cutover). Runs on PRs and on
# pushes to main + feature branches.
name: go-ci

on:
  pull_request:
  push:
    branches:
      - main      # the Python ci.yml (pytest) was retired; go-ci now owns main CI
      - "feat/**" # feature branches (e.g. feat/gasworks-go-cli)

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Pinned patch (not the floating "1.26"). The Gas City eventexport dependency
          # establishes a 1.26.4 baseline; this module uses 1.26.6 to fix GO-2026-5856
          # and the stdlib CVEs that lingered at earlier toolchain versions.
          go-version: "1.26.6"

      - name: gofmt (fail on unformatted)
        run: |
          # gofmt -l lists files that need formatting; any output means the tree is dirty.
          # vendor/ is excluded: third-party vendored code is verified byte-for-byte against
          # upstream by the "Verify vendored dependencies" step below, so its formatting is
          # fixed by the pinned dependency version and is not ours to reformat (some deps
          # still ship pre-//go:build tag syntax that a newer gofmt would rewrite, which would
          # then be reverted by `go mod vendor` — an unresolvable gofmt/vendor-verify conflict).
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # Supply-chain guard: the build MUST use the committed vendor/ tree (M19), and that
      # tree MUST exactly match the module graph. `go mod verify` checks the module cache
      # against go.sum; re-running `go mod vendor` and diffing proves vendor/ is neither
      # stale nor tampered. A non-empty diff fails the job.
      - name: Verify vendored dependencies
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code vendor/ go.mod go.sum

      - name: go build
        run: go build -mod=vendor ./...

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: go test (race)
        run: go test -mod=vendor ./... -race -count=1

      # Vulnerability gate. Installs govulncheck pinned to a released version and fails on
      # any reachable CVE. Proven clean against go1.26.6 (0 reachable vulns). This gate fails
      # only on a NEW reachable CVE in the stdlib or a dependency.
      - name: govulncheck
        env:
          # govulncheck@v1.4.0's own go.mod floor is 1.25, so a default install would build
          # it WITH 1.25 — and a 1.25-built govulncheck cannot analyze this go 1.26.6 module.
          # GOTOOLCHAIN=local forces it to build + scan with the setup-go 1.26.6 above.
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          # No -mod flag (govulncheck doesn't accept it); with vendor/ present it scans in
          # vendor mode automatically.
          "$(go env GOPATH)/bin/govulncheck" ./...

  darwin-observer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Exercise native macOS Observer boundaries
        run: >-
          go test -mod=vendor
          ./internal/observer/local
          ./internal/observer/adapter/codex
          ./internal/observer/runwrap
          ./internal/observer/daemon
          ./cmd/gasworks-companion
          -count=1

      - name: Build macOS Observer companion
        run: go build -mod=vendor -trimpath ./cmd/gasworks-companion

  windows-locking:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Exercise credential-store locking on Windows
        run: go test -mod=vendor ./internal/store ./cmd/gasworks -run '^(TestConcurrentUpdatePreservesFields|TestCredentialProvider(SerializesRefreshRotationAcrossProcesses|RecoversRefreshLockAfterProcessTermination))$' -count=1

  # Dry-run the release pipeline on every PR/push to PROVE the static CGO-free cross-build
  # for all targets keeps working — catches a broken .goreleaser.yaml or a non-portable
  # dependency before a real `v*` tag is cut. No signing/publishing happens in --snapshot.
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: GoReleaser snapshot (cross-compile dry-run)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: build --snapshot --clean
